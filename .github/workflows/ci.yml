name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the run in flight pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # No SHEET_ID here on purpose: the build must succeed against the
      # committed snapshot, which is the same path production falls back to.
      - name: Build
        run: npm run build

      # src/routeTree.gen.ts is committed and regenerated by the build above.
      # A diff here means someone added a route file without committing the
      # regenerated tree. Checked after the build, not via `tsr generate`,
      # because the standalone CLI omits the Register block the plugin writes.
      - name: Check the committed route tree is up to date
        run: git diff --exit-code src/routeTree.gen.ts
